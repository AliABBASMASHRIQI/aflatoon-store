<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_settings.store_name if app_settings else "Aflatoon Studio" }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {500: "#4f46e5", 600: "#4338ca", 700: "#3730a3"} } } } };
  </script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="flex min-h-screen">
    {% if session.get("authed") %}
    {% include "_sidebar.html" %}
    {% endif %}
    <main class="flex-1 p-4 md:p-8">
      <div class="max-w-7xl mx-auto">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="mb-3 px-4 py-3 rounded-md text-sm font-medium
                {% if cat == 'success' %}bg-emerald-100 text-emerald-800
                {% elif cat == 'danger' %}bg-red-100 text-red-800
                {% else %}bg-sky-100 text-sky-800{% endif %}">
                {{ msg }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white rounded-lg shadow p-8">
  <h1 class="text-2xl font-bold mb-1">{{ app_settings.store_name if app_settings else "Aflatoon Studio" }}</h1>
  <p class="text-sm text-slate-500 mb-6">Log in to the management system</p>
  <form method="post">
    <label class="block text-sm font-medium mb-1">Username</label>
    <input name="username" required class="w-full border rounded px-3 py-2 mb-4" autofocus>
    <label class="block text-sm font-medium mb-1">Password</label>
    <input name="password" type="password" required class="w-full border rounded px-3 py-2 mb-6">
    <button class="w-full bg-brand-600 hover:bg-brand-700 text-white rounded py-2 font-medium">Log in</button>
  </form>
  <p class="text-xs text-slate-400 mt-4">Default login is admin / aflatoon2026 — change it in Settings.</p>
</div>
{% endblock %}
